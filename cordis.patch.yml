# dsh-session-pin bundle patch: inserts the plugin row into a profile's layer
# stack. The node half (exports ".") owns the pinned-session registry and the
# /dsh-session-pin JSON routes; the `dsh.client` declaration in package.json
# makes the browser half (exports "./client") load in the web GUI, where it
# injects the pinned section above the workspace browser.
- insert:
    - id: dsh-session-pin
      name: dsh-session-pin
